<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hướng Dẫn Sử Dụng — Kinx Auto</title>
<meta name="description" content="Hướng dẫn sử dụng toàn diện Kinx Auto: tạo ảnh, video từ ảnh, nhân vật đồng nhất, video flow, comic và nhiều hơn nữa." />
<script src="https://cdn.tailwindcss.com?plugins=typography,line-clamp"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        dark: { 900: '#0a0a12', 800: '#111122', 700: '#1a1a2e' },
        brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
        violet2: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' },
      },
      keyframes: {
        'float': { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-12px)' } },
        'pulse-glow': { '0%,100%': { opacity: '.4' }, '50%': { opacity: '.9' } },
        'gradient-x': { '0%,100%': { backgroundPosition: '0% 50%' }, '50%': { backgroundPosition: '100% 50%' } },
        'fade-up': { '0%': { opacity: '0', transform: 'translateY(24px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
        'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
        'slide-left': { '0%': { opacity: '0', transform: 'translateX(40px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
        'spin-slow': { '0%': { transform: 'rotate(0)' }, '100%': { transform: 'rotate(360deg)' } },
      },
      animation: {
        'float': 'float 6s ease-in-out infinite',
        'pulse-glow': 'pulse-glow 4s ease-in-out infinite',
        'gradient-x': 'gradient-x 8s ease infinite',
        'fade-up': 'fade-up .7s ease-out both',
        'fade-in': 'fade-in 1s ease-out both',
        'slide-left': 'slide-left .7s ease-out both',
        'spin-slow': 'spin-slow 12s linear infinite',
      },
    },
  },
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
  [data-reveal].revealed { opacity: 1; transform: translateY(0); }
  [data-reveal="left"] { transform: translateX(-32px); }
  [data-reveal="left"].revealed { transform: translateX(0); }
  [data-reveal="right"] { transform: translateX(32px); }
  [data-reveal="right"].revealed { transform: translateX(0); }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track { background: #0a0a12; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#2563eb,#7c3aed); border-radius: 8px; }
  .glass { background: rgba(255,255,255,.04); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.09); }
  .text-gradient { background: linear-gradient(90deg,#60a5fa,#a78bfa,#60a5fa); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gradient-x 6s ease infinite; }
  .card-glow:hover { box-shadow: 0 0 0 1px rgba(139,92,246,.35), 0 20px 60px -15px rgba(99,102,241,.4); transform: translateY(-4px); }
  .step-line::before { content: ''; position: absolute; left: 19px; top: 44px; bottom: -20px; width: 2px; background: linear-gradient(180deg,#2563eb,#7c3aed); border-radius: 2px; }
  .step-line:last-child::before { display: none; }
  .active-nav { background: linear-gradient(90deg,rgba(37,99,235,.25),rgba(124,58,237,.25)); color: #fff; border-left: 3px solid #8b5cf6; }
  html { scrollbar-width: thin; scrollbar-color: #7c3aed #0a0a12; }
</style>
</head>

<body class="bg-[#0a0a12] text-slate-200 font-sans antialiased overflow-x-hidden selection:bg-violet-600/40">

<!-- ====== ANIMATED BACKGROUND ====== -->
<div class="fixed inset-0 -z-10 pointer-events-none">
  <div class="absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full bg-blue-600/20 blur-[120px] animate-pulse-glow"></div>
  <div class="absolute top-1/3 -right-40 w-[500px] h-[500px] rounded-full bg-violet-600/20 blur-[120px] animate-pulse-glow" style="animation-delay:1.5s"></div>
  <div class="absolute bottom-0 left-1/3 w-[400px] h-[400px] rounded-full bg-indigo-500/15 blur-[100px] animate-pulse-glow" style="animation-delay:3s"></div>
  <div class="absolute inset-0 opacity-[.05]" style="background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:42px 42px;"></div>
</div>

<!-- ====== PROGRESS BAR ====== -->
<div id="progress" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-blue-500 via-violet-500 to-purple-600 z-50 w-0 transition-all duration-150"></div>



<!-- ====== HERO ====== -->
<section id="bat-dau" class="relative min-h-screen flex items-center justify-center px-6 pt-20">
  <div class="max-w-4xl mx-auto text-center">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass text-sm text-blue-300 mb-8 animate-fade-up">
      <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
      </span>
      Hướng dẫn chính thức v1.0
    </div>
    <h1 class="text-5xl md:text-7xl font-black leading-tight tracking-tight mb-6 animate-fade-up" style="animation-delay:.1s">
      Làm chủ <span class="text-gradient">Kinx Auto</span><br class="hidden md:block" /> trong vài phút
    </h1>
    <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto mb-10 animate-fade-up" style="animation-delay:.2s">
      Tự động hóa toàn bộ quy trình sáng tạo — từ ảnh nhân vật, video đồng nhất, đến video flow hoàn chỉnh. Tất cả trong một ứng dụng.
    </p>
    
</body>
</html>
